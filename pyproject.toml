[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tfm-gait-transformer"
version = "1.0.0"
description = "Pipeline algoritmico para evaluacion de marcha."
requires-python = ">=3.9"

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "torch",
    "joblib",
    "influxdb-client",
    "pyyaml"
]

[tool.setuptools.packages.find]
where = ["."]