[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tfm-gait-transformer"
version = "1.0.0"
description = "Pipeline algoritmico para evaluacion de marcha."
requires-python = ">=3.9"

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "torch",
    "joblib",
    "influxdb-client",
    "pyyaml",
    "pydantic",
    "h5py",
    "matplotlib",
    "scikit-learn",
    "pytest",
    "imageio",
    "seaborn",
    "openpyxl",
    "ahrs"
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "A01_EXTRACCION_DATOS",
    "A02_LABELING",
    "A03_PREPROCESAMIENTO",
    "A04_TRANSFORMER"
]
